# Despliegue de MedRecord en Render (Blueprint).
# Crea 3 recursos: la base de datos, el backend (API) y la app (frontend).
# Render > New > Blueprint > elige este repositorio.

databases:
  - name: medrecord-db
    plan: free
    region: virginia
    databaseName: medrecord
    user: medrecord
    postgresMajorVersion: "16"

services:
  # Backend Django (API + JWT + panel /admin/)
  - type: web
    name: medrecord-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /salud/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medrecord-db
          property: connectionString
      # En el plan gratuito no hay "workers": las alertas corren dentro del backend
      - key: SCHEDULER_EN_WEB
        value: "true"
      - key: GUNICORN_WORKERS
        value: "2"
      # Dirección pública de la app, ej. https://medrecord-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

  # Frontend React (sitio estático, gratis)
  - type: web
    name: medrecord-web
    runtime: static
    rootDir: MedRecord-2
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Dirección pública del backend + /api, ej. https://medrecord-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
